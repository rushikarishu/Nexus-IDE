[package]
name = "ai-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "1.0"
bytes = "1.11.0"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
regex = "1.12.2"
lru = "0.16.2"
